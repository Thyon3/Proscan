# Reduced memory allocation to prevent "paging file is too small" errors
# Adjust these values based on your system's available RAM
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:MaxGCPauseMillis=200
android.useAndroidX=true
android.enableJetifier=true
org.gradle.java.home=C:\\Users\\hp\\AppData\\Local\\Programs\\Eclipse Adoptium\\jdk-17.0.11.9-hotspot

# Enable Gradle daemon and parallel builds for better performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# CRITICAL FIX: Disable Kotlin incremental compilation
# Fixes "IllegalArgumentException: this and base files have different roots" error
# This occurs when project is on D:\ drive but dependencies are on C:\ drive
kotlin.incremental=false
kotlin.incremental.usePreciseJavaTracking=false

# Prevent Kotlin cache issues across different drives
kotlin.compiler.execution.strategy=in-process

# Disable Kotlin JVM target validation (some Android plugins still compile Java with 11 while Kotlin targets 17)
kotlin.jvm.target.validation.mode=ignore